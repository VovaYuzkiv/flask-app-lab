{% extends 'base.html' %}

{% block title %} POSTS {% endblock %}

{% block css%}
    <link rel="stylesheet" href="{{url_for('.static',filename='css/style')}}">
{%endblock%}

{% block content %}

<h1>Articles</h1>
    
    <div>
        <a class="btn btn-primary mb-5" href="{{url_for('posts.creat_new_post')}}">add new post</a>
    </div>


<ul>
    {% for post in posts%}
        <div class="card h-100">
            <img src="{{url_for('.static',filename='images/default.png')}}" class="card-img-top" alt="{{post.title}}">
            <div class="card-body">
                <a href="{{ url_for('posts.detail_post', id=post.get('id')) }}"><h5 class="card-title">{{post.title}}</h5></a>
                    <p class="card-text">{{post.content}}</p>
                    <p class="card-text"><small class="text-muted">Date: {{post.date}}</small></p>
                    <p class="card-text"><small class="text-muted">Author: {{post.author}}</small></p>
                </a>
            </div>
        </div>
    {% endfor %}
</ul>

{% endblock %}
