{%extends 'base.html'%}
{% block title%}Log in{% endblock %}
{% block content%}
<div class="container mt-5">
    <div class="row">
        <div class="col-md-4">
            <div class="card text-center">
                <img src="{{ url_for('.static', filename='images/' + user.imageFile) }}" class="card-img-top rounded-circle mx-auto mt-3" style="width: 150px;" alt="Profile Picture">
                <div class="card-body">
                    <h5 class="card-title">{{user.username}}</h5>
                    <p class="card-text"></p>
                    <a class="btn w-1 btn-danger m-2" href="{{url_for('.logout')}}">logout</a>
                    <a class="btn w-1 btn-primary m-2" href="{{url_for('.update_profile')}}">update profile</a>
                    <a class="btn w-1 btn-primary m-2" href="{{url_for('.change_password')}}">change password</a>
                </div>
            </div>
        </div>
        <div class="col-md-8">
            <div class="card p-4">
                <h4>About me</h4>
                <p>{{user.aboutMe}}</p>
                <h4>last seen</h4>
                {% if current_user.is_authenticated %}
                <p>Now is active</p>
                {% else %}
                <p>{{ user.last_seen }}</p>
                {%endif%}
            </div>
        </div>
    </div>
</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}
