{%extends 'base.html'%}
{% block title%}Log in{% endblock %}
{% block content%}
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card shadow p-4" style="width: 100%; max-width: 400px;">
            <h2 class="text-center mb-4">Логін</h2>
            <form method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Логін</label>
                    <input type="text" class="form-control" name="username" placeholder="Введіть ваш логін">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Пароль</label>
                    <input type="password" class="form-control" name="password" placeholder="Введіть пароль">
                </div>
                <button type="submit" class="btn btn-primary w-100">Увійти</button>
            </form>
        </div>
    </div>
{% endblock %}
